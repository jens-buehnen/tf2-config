alias cls clear
alias switchnext "switchsecondary"
alias switchprev "switchprimary"
alias switchprimary "slot1; alias switchnext switchsecondary; alias switchprev switchmelee"
alias switchsecondary "slot2; alias switchnext switchmelee; alias switchprev switchprimary"
alias switchmelee "slot3; alias switchnext switchprimary; alias switchprev switchsecondary"
